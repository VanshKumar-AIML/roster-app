<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Roster — find people to build with</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js">
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&display=swap');

        /* ─── Design System ─── */
        :root {
            --bg-page: #F5F7F8;
            --bg-card: #FFFFFF;
            --bg-input: #F1F4F6;
            --bg-hover: #EBF0F2;
            --ink: #0F1A1C;
            --ink-soft: #4A5B5E;
            --ink-muted: #7A8C8F;
            --line: #DCE3E6;
            --line-strong: #BCC8CC;
            --primary: #1D4A4D;
            --primary-light: #2D6A6E;
            --primary-dark: #0F3336;
            --primary-glow: rgba(29, 74, 77, 0.12);
            --accent: #C69C4E;
            --accent-light: #DFC28A;
            --accent-glow: rgba(198, 156, 78, 0.18);
            --green: #3A7A5A;
            --green-bg: #E8F3ED;
            --rust: #B45A4A;
            --rust-bg: #F5EAE7;
            --gold: #C69C4E;
            --radius: 12px;
            --radius-sm: 8px;
            --shadow-card: 0 2px 12px rgba(15, 26, 28, 0.06), 0 1px 3px rgba(15, 26, 28, 0.04);
            --shadow-card-hover: 0 8px 32px rgba(15, 26, 28, 0.10), 0 2px 8px rgba(15, 26, 28, 0.05);
            --shadow-dropdown: 0 12px 48px rgba(15, 26, 28, 0.12);
            --shadow-drawer: -8px 0 48px rgba(15, 26, 28, 0.10);
            --transition: 0.25s cubic-bezier(0.22, 1, 0.36, 1);
            --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            --font-serif: 'Playfair Display', Georgia, serif;
            --font-mono: 'IBM Plex Mono', 'JetBrains Mono', monospace;
        }

        *, *::before, *::after { box-sizing: border-box; }
        html, body {
            margin: 0; padding: 0; min-height: 100vh;
            background: var(--bg-page);
            color: var(--ink);
            font-family: var(--font-sans);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        a { color: inherit; text-decoration: none; }
        button { font: inherit; cursor: pointer; border: none; background: none; }
        input, textarea, select { font: inherit; color: var(--ink); }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 8px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--ink-soft); }

        .nav {
            position: relative; z-index: 5; max-width: 1200px; margin: 0 auto;
            padding: 20px 28px 0; display: flex; align-items: center;
            justify-content: space-between; flex-wrap: wrap; gap: 12px;
        }
        .wordmark {
            font-family: var(--font-serif); font-weight: 800; font-size: 26px;
            letter-spacing: -0.02em; display: flex; align-items: baseline; gap: 4px;
            color: var(--ink); transition: color var(--transition);
        }
        .wordmark:hover { color: var(--primary); }
        .wordmark .dot { color: var(--accent); }

        .nav-links {
            display: flex; align-items: center; gap: 16px;
        }
        .nav-link {
            font-size: 13px; font-weight: 500; color: var(--ink-soft);
            padding: 6px 4px; border-bottom: 2px solid transparent;
            transition: color var(--transition), border-color var(--transition);
        }
        .nav-link:hover { color: var(--ink); border-color: var(--primary); }

        .user-chip {
            display: flex; align-items: center; gap: 8px; font-size: 13px;
            font-weight: 500; color: var(--ink-soft); background: var(--bg-input);
            padding: 4px 12px 4px 4px; border-radius: 40px; border: 1px solid var(--line);
        }
        .user-chip .dot-avatar {
            width: 30px; height: 30px; border-radius: 50%; background: var(--primary);
            color: #fff; display: flex; align-items: center; justify-content: center;
            font-family: var(--font-serif); font-weight: 700; font-size: 12px;
        }

        .nav-btn {
            padding: 8px 20px; border-radius: 40px; font-size: 13px; font-weight: 600;
            transition: all var(--transition); background: var(--primary); color: #fff;
        }
        .nav-btn:hover {
            background: var(--primary-dark); transform: translateY(-1px);
            box-shadow: 0 4px 16px var(--primary-glow);
        }
        .nav-btn.ghost {
            background: transparent; color: var(--ink); border: 1.5px solid var(--line);
        }
        .nav-btn.ghost:hover { border-color: var(--primary); color: var(--primary); box-shadow: none; transform: none; }
        .nav-btn.ghost.danger:hover { border-color: var(--rust); color: var(--rust); }

        .toast {
            position: fixed; bottom: 32px; left: 50%;
            transform: translateX(-50%) translateY(16px);
            background: var(--ink); color: #fff; font-size: 13px; font-weight: 500;
            padding: 12px 28px; border-radius: var(--radius-sm); box-shadow: var(--shadow-dropdown);
            opacity: 0; pointer-events: none;
            transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
            z-index: 50;
            background: rgba(15, 26, 28, 0.92);
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        /* ─── Landing ─── */
        .hero {
            position: relative; z-index: 2; max-width: 1200px; margin: 0 auto;
            padding: 60px 28px 40px; display: grid;
            grid-template-columns: 1.1fr 0.9fr; gap: 56px; align-items: center;
        }
        .hero-content .badge {
            display: inline-block; font-size: 11px; font-weight: 600;
            letter-spacing: 0.06em; text-transform: uppercase;
            color: var(--primary); background: var(--primary-glow);
            padding: 4px 14px; border-radius: 40px; margin-bottom: 18px;
        }
        .hero-content h1 {
            font-family: var(--font-serif); font-weight: 800; font-size: 52px;
            line-height: 1.06; margin: 0 0 18px; letter-spacing: -0.02em;
        }
        .hero-content h1 em { color: var(--primary); font-style: italic; }
        .hero-content p {
            font-size: 17px; line-height: 1.7; color: var(--ink-soft);
            max-width: 460px; margin: 0 0 28px;
        }
        .hero-ctas { display: flex; gap: 12px; flex-wrap: wrap; }
        .hero-ctas .nav-btn { padding: 12px 28px; font-size: 14px; }
        .stat-row {
            display: flex; gap: 40px; margin-top: 44px; flex-wrap: wrap;
        }
        .stat .n {
            font-family: var(--font-serif); font-weight: 800; font-size: 30px;
            color: var(--ink); display: block; line-height: 1.1;
        }
        .stat .l {
            font-size: 12px; font-weight: 500; color: var(--ink-muted);
            text-transform: uppercase; letter-spacing: 0.04em;
        }
        .hero-card {
            background: var(--bg-card); border-radius: var(--radius);
            padding: 28px 30px; box-shadow: var(--shadow-card);
            border: 1px solid var(--line);
            transition: box-shadow var(--transition), transform var(--transition);
            position: relative;
        }
        .hero-card:hover { box-shadow: var(--shadow-card-hover); transform: translateY(-3px); }
        .hero-card .tab {
            position: absolute; top: -10px; left: 24px; font-size: 10px;
            font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
            color: #fff; background: var(--primary);
            padding: 3px 12px; border-radius: var(--radius-sm) var(--radius-sm) 0 0;
        }
        .hero-card .name {
            font-family: var(--font-serif); font-weight: 700; font-size: 22px;
            margin-top: 6px;
        }
        .hero-card .role {
            font-size: 13px; color: var(--ink-soft); margin: 2px 0 14px;
        }
        .hero-card .skill-tags {
            display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px;
        }

        /* ─── Auth Pages ─── */
        .auth-shell {
            position: relative; z-index: 2; min-height: calc(100vh - 100px);
            display: flex; align-items: center; justify-content: center;
            padding: 40px 20px;
        }
        .auth-card {
            width: 100%; max-width: 420px; background: var(--bg-card);
            border-radius: var(--radius); padding: 38px 34px 32px;
            box-shadow: var(--shadow-card); border: 1px solid var(--line);
            position: relative;
        }
        .auth-card .tab {
            position: absolute; top: -10px; left: 28px; font-size: 10px;
            font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
            color: #fff; background: var(--primary);
            padding: 3px 14px; border-radius: var(--radius-sm) var(--radius-sm) 0 0;
        }
        .auth-card h1 {
            font-family: var(--font-serif); font-weight: 800; font-size: 28px;
            margin: 4px 0 2px;
        }
        .auth-sub {
            font-size: 12px; font-weight: 500; color: var(--ink-muted);
            letter-spacing: 0.04em; text-transform: uppercase; margin-bottom: 22px;
        }
        .auth-hint {
            background: var(--bg-input); border: 1px solid var(--line);
            border-radius: var(--radius-sm); padding: 12px 16px; font-size: 13px;
            color: var(--ink-soft); line-height: 1.5; margin-bottom: 20px;
        }
        .auth-hint strong { color: var(--ink); font-weight: 600; }

        .field {
            display: flex; flex-direction: column; gap: 4px; margin-bottom: 16px;
        }
        .field.full { grid-column: 1 / -1; }
        .field label {
            font-size: 11px; font-weight: 600; letter-spacing: 0.04em;
            text-transform: uppercase; color: var(--ink-soft);
        }
        .field input, .field textarea, .field select {
            width: 100%; padding: 11px 14px; border-radius: var(--radius-sm);
            border: 1.5px solid var(--line); background: var(--bg-input);
            font-size: 14px; transition: border-color var(--transition), box-shadow var(--transition);
            outline: none;
        }
        .field input:focus, .field textarea:focus, .field select:focus {
            border-color: var(--primary); box-shadow: 0 0 0 4px var(--primary-glow);
            background: #fff;
        }
        .field textarea { resize: vertical; min-height: 70px; }
        .field-error {
            font-size: 12px; color: var(--rust); display: none; margin-top: 2px;
            font-weight: 500;
        }
        .field.has-error input, .field.has-error textarea, .field.has-error select {
            border-color: var(--rust); box-shadow: 0 0 0 4px rgba(180, 90, 74, 0.10);
        }
        .field.has-error .field-error { display: block; }

        .form-msg {
            font-size: 13px; padding: 12px 16px; border-radius: var(--radius-sm);
            margin-bottom: 16px; display: none; font-weight: 500;
        }
        .form-msg.error { display: block; background: var(--rust-bg); color: var(--rust); border: 1px solid var(--rust); }
        .form-msg.success { display: block; background: var(--green-bg); color: var(--green); border: 1px solid var(--green); }

        .auth-submit {
            width: 100%; padding: 13px; border-radius: var(--radius-sm);
            font-size: 13px; font-weight: 700; text-transform: uppercase;
            letter-spacing: 0.04em; background: var(--primary); color: #fff;
            transition: all var(--transition); margin-top: 4px;
        }
        .auth-submit:hover {
            background: var(--primary-dark); box-shadow: 0 4px 20px var(--primary-glow);
            transform: translateY(-1px);
        }
        .auth-submit:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        .auth-switch {
            text-align: center; margin-top: 20px; font-size: 13px; color: var(--ink-soft);
        }
        .auth-switch button { color: var(--primary); font-weight: 600; transition: color var(--transition); }
        .auth-switch button:hover { color: var(--primary-dark); text-decoration: underline; }
        .auth-forgot { text-align: right; margin: -6px 0 18px; }
        .auth-forgot button {
            font-size: 12px; color: var(--ink-muted); font-weight: 500;
            transition: color var(--transition);
        }
        .auth-forgot button:hover { color: var(--ink); }

        /* ─── Account ─── */
        .account-shell {
            position: relative; z-index: 2; max-width: 640px; margin: 0 auto;
            padding: 40px 28px 80px;
        }
        .account-card {
            background: var(--bg-card); border-radius: var(--radius);
            padding: 34px 36px; box-shadow: var(--shadow-card); border: 1px solid var(--line);
        }
        .account-row {
            display: flex; align-items: center; gap: 18px; margin-bottom: 24px;
        }
        .account-row .dot-avatar {
            width: 60px; height: 60px; font-size: 22px; border-radius: 50%;
            background: var(--primary); color: #fff; display: flex; align-items: center;
            justify-content: center; font-family: var(--font-serif); font-weight: 700;
        }
        .account-name { font-family: var(--font-serif); font-weight: 800; font-size: 26px; }
        .account-email { font-size: 13px; color: var(--ink-soft); margin-top: 2px; }
        .account-line {
            display: flex; justify-content: space-between; padding: 12px 0;
            border-bottom: 1px solid var(--line); font-size: 14px;
        }
        .account-line span:first-child { color: var(--ink-soft); font-weight: 500; }
        .account-line span:last-child { font-weight: 600; }

        /* ─── App: Header / Ledger ─── */
        header.app-header {
            position: relative; z-index: 2; max-width: 1200px; margin: 0 auto;
            padding: 18px 28px 0;
        }
        .ledger {
            margin-top: 18px; background: var(--bg-card); border-radius: var(--radius);
            padding: 18px 22px 16px; box-shadow: var(--shadow-card); border: 1px solid var(--line);
        }
        .search-row {
            display: flex; align-items: center; gap: 12px; border-bottom: 1.5px solid var(--line);
            padding-bottom: 12px;
        }
        .search-row .idx {
            font-size: 12px; font-weight: 600; color: var(--ink-muted);
            letter-spacing: 0.04em; text-transform: uppercase;
        }
        .search-row input[type="text"] {
            flex: 1; border: none; background: transparent; font-family: var(--font-serif);
            font-style: italic; font-size: 20px; color: var(--ink); outline: none;
            padding: 4px 0;
        }
        .search-row input::placeholder { color: var(--ink-muted); opacity: 0.6; }
        .search-count {
            font-size: 13px; font-weight: 500; color: var(--ink-muted); white-space: nowrap;
            background: var(--bg-input); padding: 2px 14px; border-radius: 40px;
        }

        .filters {
            display: flex; gap: 24px; flex-wrap: wrap; padding-top: 14px; align-items: flex-end;
        }
        .filter-group { display: flex; flex-direction: column; gap: 6px; }
        .filter-label {
            font-size: 10px; font-weight: 700; letter-spacing: 0.08em;
            text-transform: uppercase; color: var(--ink-muted);
        }
        .chip-row { display: flex; gap: 5px; flex-wrap: wrap; }
        .chip {
            font-size: 12px; font-weight: 500; border: 1.5px solid var(--line);
            background: var(--bg-input); color: var(--ink-soft);
            padding: 4px 14px; border-radius: 40px; cursor: pointer;
            transition: all var(--transition);
        }
        .chip:hover { border-color: var(--primary-light); color: var(--ink); background: var(--bg-hover); }
        .chip.active { background: var(--primary); border-color: var(--primary); color: #fff; }
        .chip.active:hover { background: var(--primary-dark); border-color: var(--primary-dark); }
        .filter-group .nav-btn { padding: 6px 18px; font-size: 12px; border-radius: 40px; }

        /* ─── Grid ─── */
        main.app-main {
            position: relative; z-index: 2; max-width: 1200px; margin: 0 auto;
            padding: 26px 28px 80px;
        }
        .grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 24px;
        }
        .empty-state {
            font-family: var(--font-serif); font-size: 22px; color: var(--ink-soft);
            padding: 70px 10px; text-align: center; grid-column: 1 / -1;
        }

        .card {
            position: relative; background: var(--bg-card); border-radius: var(--radius);
            padding: 24px 22px 20px; box-shadow: var(--shadow-card);
            border: 1px solid var(--line); cursor: pointer;
            transition: all var(--transition);
        }
        .card:hover {
            transform: translateY(-4px); box-shadow: var(--shadow-card-hover);
            border-color: var(--primary-light);
        }
        .card .tab {
            position: absolute; top: -10px; left: 20px; font-size: 10px;
            font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
            color: #fff; background: var(--role-color, var(--primary));
            padding: 3px 12px; border-radius: var(--radius-sm) var(--radius-sm) 0 0;
        }
        .card-top {
            display: flex; align-items: center; gap: 14px; margin-top: 4px;
        }
        .avatar {
            width: 48px; height: 48px; border-radius: 50%; display: flex;
            align-items: center; justify-content: center; font-family: var(--font-serif);
            font-weight: 700; font-size: 17px; background: var(--role-color, var(--primary));
            color: #fff; flex-shrink: 0;
        }
        .card .name { font-family: var(--font-serif); font-weight: 700; font-size: 20px; line-height: 1.2; }
        .card .role-tag { font-size: 12px; font-weight: 500; color: var(--ink-soft); margin-top: 1px; }
        .status-row {
            display: flex; align-items: center; gap: 6px; margin: 12px 0 8px;
            font-size: 12px; font-weight: 500; color: var(--ink-soft);
        }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
        .meta-row { font-size: 12px; color: var(--ink-muted); margin-bottom: 12px; }
        .skill-tags { display: flex; flex-wrap: wrap; gap: 5px; }
        .tag {
            font-size: 11px; font-weight: 500; border: 1px solid var(--line);
            padding: 2px 11px; border-radius: 40px; color: var(--ink-soft);
            background: var(--bg-input); transition: all var(--transition);
        }
        .tag.more { color: var(--accent); border-color: var(--accent-light); background: var(--accent-glow); }

        /* ─── Drawer ─── */
        .overlay {
            position: fixed; inset: 0; background: rgba(15, 26, 28, 0.40);
            opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
            z-index: 20; 
        }
        .overlay.show { opacity: 1; pointer-events: auto; }
        .drawer {
            position: fixed; top: 0; right: 0; height: 100%; width: min(480px, 100vw);
            background: var(--bg-card); transform: translateX(100%);
            transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1);
            z-index: 21; overflow-y: auto; box-shadow: var(--shadow-drawer);
        }
        .drawer.show { transform: translateX(0); }
        .drawer-inner { padding: 32px 30px 60px; position: relative; }
        .drawer-close {
            position: absolute; top: 18px; right: 20px; width: 36px; height: 36px;
            border-radius: 50%; border: 1px solid var(--line); font-size: 18px;
            color: var(--ink-soft); display: flex; align-items: center;
            justify-content: center; transition: all var(--transition);
            background: var(--bg-input);
        }
        .drawer-close:hover { border-color: var(--ink); color: var(--ink); background: var(--bg-hover); }

        .drawer .tab {
            display: inline-block; font-size: 10px; font-weight: 700;
            letter-spacing: 0.06em; text-transform: uppercase; color: #fff;
            background: var(--role-color, var(--primary));
            padding: 3px 14px; border-radius: var(--radius-sm); margin-bottom: 14px;
        }
        .drawer .avatar { width: 64px; height: 64px; font-size: 24px; }
        .drawer-head { display: flex; gap: 18px; align-items: center; }
        .drawer-name { font-family: var(--font-serif); font-weight: 800; font-size: 28px; line-height: 1.1; }
        .drawer-role { font-size: 14px; color: var(--ink-soft); margin-top: 2px; font-weight: 500; }
        .section-label {
            font-size: 11px; font-weight: 700; letter-spacing: 0.08em;
            text-transform: uppercase; color: var(--ink-muted);
            margin: 28px 0 12px; display: flex; align-items: center; gap: 12px;
        }
        .section-label::after { content: ""; flex: 1; height: 1.5px; background: var(--line); }
        .bio { font-size: 15px; line-height: 1.7; color: var(--ink); }
        .stamp-grid { display: flex; flex-direction: column; gap: 8px; }
        .stamp-row { display: flex; align-items: center; gap: 12px; }
        .stamp-name { font-size: 13px; font-weight: 500; width: 120px; flex-shrink: 0; }
        .stamps { display: flex; gap: 4px; }
        .stamp { width: 14px; height: 14px; border: 1.5px solid var(--line); border-radius: 3px; transition: all var(--transition); }
        .stamp.filled { background: var(--primary); border-color: var(--primary); }
        .contact-block {
            border: 1.5px solid var(--line); border-radius: var(--radius-sm);
            padding: 18px 20px; background: var(--bg-input);
        }
        .contact-locked { text-align: center; padding: 4px 0; }
        .contact-locked > div { font-size: 13px; color: var(--ink-soft); }
        .reveal-btn {
            background: var(--primary); color: #fff; padding: 8px 22px;
            border-radius: 40px; font-size: 13px; font-weight: 600;
            transition: all var(--transition); margin-top: 8px;
        }
        .reveal-btn:hover { background: var(--primary-dark); box-shadow: 0 4px 16px var(--primary-glow); }
        .contact-line {
            display: flex; justify-content: space-between; align-items: center;
            font-size: 14px; padding: 8px 0; border-bottom: 1px solid var(--line);
        }
        .contact-line:last-child { border-bottom: none; }
        .contact-line span:first-child { color: var(--ink-soft); font-weight: 500; }
        .contact-line span:last-child { font-weight: 500; }

        .resume-box {
            border: 1.5px solid var(--line); border-radius: var(--radius-sm);
            padding: 14px 18px; display: flex; align-items: center; gap: 14px;
            background: var(--bg-input);
        }
        .resume-thumb {
            width: 44px; height: 56px; background: #fff; border: 1px solid var(--line);
            border-radius: 4px; flex-shrink: 0; display: flex; align-items: center;
            justify-content: center; font-size: 9px; font-weight: 600;
            color: var(--ink-muted); text-transform: uppercase;
        }
        .resume-link {
            font-weight: 600; color: var(--primary);
            border-bottom: 2px solid var(--primary-glow);
            transition: border-color var(--transition);
        }
        .resume-link:hover { border-color: var(--primary); }
        .no-resume { font-size: 13px; color: var(--ink-muted); font-style: italic; }

        /* ─── Upload Modal ─── */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(15, 26, 28, 0.50);
            display: none; align-items: center; justify-content: center;
            z-index: 30; padding: 20px;
        }
        .modal-overlay.show { display: flex; }
        .modal {
            background: var(--bg-card); border-radius: var(--radius); width: 100%;
            max-width: 540px; max-height: 90vh; overflow-y: auto;
            padding: 32px 30px 28px; box-shadow: var(--shadow-dropdown);
            position: relative; animation: modalIn 0.3s cubic-bezier(0.22, 1, 0.36, 1);
        }
        @keyframes modalIn {
            from { opacity: 0; transform: scale(0.96) translateY(12px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        .modal h2 { font-family: var(--font-serif); font-weight: 800; font-size: 26px; margin: 0 0 2px; }
        .modal .sub { font-size: 13px; color: var(--ink-soft); margin-bottom: 20px; }
        .modal-close {
            position: absolute; top: 18px; right: 20px; width: 32px; height: 32px;
            border-radius: 50%; border: 1px solid var(--line); font-size: 16px;
            color: var(--ink-soft); display: flex; align-items: center;
            justify-content: center; transition: all var(--transition);
            background: var(--bg-input);
        }
        .modal-close:hover { border-color: var(--ink); color: var(--ink); }
        .dropzone {
            border: 2px dashed var(--line); border-radius: var(--radius-sm);
            padding: 32px 16px; text-align: center; font-size: 14px;
            color: var(--ink-soft); cursor: pointer; transition: all var(--transition);
            background: var(--bg-input);
        }
        .dropzone:hover, .dropzone.drag { border-color: var(--primary); background: var(--primary-glow); color: var(--ink); }
        .dropzone strong { color: var(--ink); font-weight: 600; }
        .dropzone input { display: none; }
        .extract-status {
            font-size: 13px; font-weight: 500; color: var(--primary);
            margin-top: 14px; display: none;
        }
        .extract-status.show { display: block; }
        .thumb-preview { display: flex; gap: 14px; align-items: center; margin-top: 14px; flex-wrap: wrap; }
        .thumb-preview canvas { border: 1px solid var(--line); border-radius: var(--radius-sm); background: #fff; max-width: 100%; height: auto; }
        .form-grid { display: none; margin-top: 20px; gap: 14px; grid-template-columns: 1fr 1fr; }
        .form-grid.show { display: grid; }
        .form-grid .field .hint { font-size: 10px; font-weight: 500; color: var(--accent); }
        .add-btn {
            grid-column: 1 / -1; padding: 13px; border-radius: var(--radius-sm);
            font-size: 13px; font-weight: 700; text-transform: uppercase;
            letter-spacing: 0.04em; background: var(--primary); color: #fff;
            transition: all var(--transition); margin-top: 4px;
        }
        .add-btn:hover { background: var(--primary-dark); box-shadow: 0 4px 20px var(--primary-glow); transform: translateY(-1px); }

        footer.site-footer {
            position: relative; z-index: 2; text-align: center; padding: 28px 20px 36px;
            font-size: 12px; color: var(--ink-muted); border-top: 1px solid var(--line);
            margin-top: 20px;
        }

        @media (max-width: 820px) {
            .hero { grid-template-columns: 1fr; padding-top: 36px; gap: 36px; }
            .hero-content h1 { font-size: 38px; }
            .hero-content p { max-width: 100%; }
            .stat-row { gap: 24px; }
        }
        @media (max-width: 600px) {
            .nav { padding: 16px 18px 0; }
            .wordmark { font-size: 22px; }
            .nav-links { gap: 10px; flex-wrap: wrap; }
            .nav-link { font-size: 12px; }
            .hero-content h1 { font-size: 30px; }
            .hero { padding: 28px 18px 20px; }
            .auth-card { padding: 28px 20px 24px; }
            .account-card { padding: 24px 18px; }
            .ledger { padding: 14px 16px 12px; }
            .search-row input[type="text"] { font-size: 16px; }
            .form-grid { grid-template-columns: 1fr; }
            .grid { grid-template-columns: 1fr; }
            .drawer { width: 100vw; }
            .drawer-inner { padding: 24px 18px 40px; }
            .drawer-name { font-size: 22px; }
            .filter-group .nav-btn { font-size: 11px; padding: 5px 14px; }
            .filters { gap: 14px; }
            .user-chip { font-size: 12px; padding: 3px 10px 3px 3px; }
            .user-chip .dot-avatar { width: 26px; height: 26px; font-size: 10px; }
            header.app-header { padding: 12px 16px 0; }
            main.app-main { padding: 18px 16px 60px; }
            .modal { padding: 24px 18px 20px; }
            .stat .n { font-size: 24px; }
        }
        @media (max-width: 400px) {
            .hero-content h1 { font-size: 26px; }
            .search-row { flex-wrap: wrap; gap: 6px; }
            .search-row .idx { font-size: 10px; }
            .search-count { font-size: 11px; padding: 0 10px; }
            .chip { font-size: 11px; padding: 3px 10px; }
        }
        .flex-center { display: flex; align-items: center; justify-content: center; }
        .gap-8 { gap: 8px; }
        .mt-8 { margin-top: 8px; }
        .mb-8 { margin-bottom: 8px; }
        .text-muted { color: var(--ink-muted); }
        .text-soft { color: var(--ink-soft); }
        .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); border: 0; }
    </style>
</head>
<body>
    <div id="view"></div>

    <script>
        /* ═══════════════════════════════════════════════════════════════
           ROSTER — Full‑stack frontend with ATS scoring + Face Login
           ═══════════════════════════════════════════════════════════════ */

        // Relative path: works whether you open this via the Node server
        // (recommended — same origin, cookies work automatically) or proxy
        // it behind something else later. If you ever serve this file from
        // a completely different origin than the API, change this back to
        // an absolute URL like 'http://localhost:3001/api'.
        const API_BASE = '/api';
        let currentUser = null;
        let candidates = [];
        let appState = { query: '', role: 'ALL', avail: 'ALL' };
        let currentResumeFile = null; // BUGFIX: we now keep the actual File so it can be uploaded
        let atsMode = false;

        const ROLE_COLOR = { ENG: '#1D4A4D', DES: '#C69C4E', PM: '#B45A4A', DAT: '#3A7A5A', MKT: '#6B7A7D', OPS: '#2D4F54' };
        const ROLE_LABEL = { ENG: 'Engineering', DES: 'Design', PM: 'Product', DAT: 'Data', MKT: 'Marketing', OPS: 'Operations' };
        const AVAIL = {
            available: { label: 'Available now', color: '#3A7A5A' },
            open: { label: 'Open to offers', color: '#C69C4E' },
            booked: { label: 'Currently booked', color: '#B45A4A' }
        };

        function initials(name) {
            if (!name) return '?';
            return name.split(' ').map(w => w[0]).slice(0, 2).join('').toUpperCase();
        }

        function isValidEmail(v) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v); }

        function pdfReaderAvailable() { return typeof pdfjsLib !== 'undefined'; }
        if (pdfReaderAvailable()) {
            pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        }

        /* ─── API helpers ─── */
        async function apiFetch(path, opts = {}) {
            try {
                const res = await fetch(`${API_BASE}${path}`, {
                    ...opts,
                    credentials: 'include',
                    headers: { 'Content-Type': 'application/json', ...(opts.headers || {}) }
                });
                const data = await res.json().catch(() => ({}));
                return { ok: res.ok, status: res.status, data };
            } catch (_) {
                return { ok: false, status: 0, data: { error: 'Network error — is the backend running?' } };
            }
        }

        /* ─── Router ─── */
        const PROTECTED_ROUTES = ['#/app', '#/account'];
        function currentRoute() { return window.location.hash || '#/'; }
        function navigate(hash) { window.location.hash = hash; }

        async function guardAndRender() {
            const route = currentRoute();
            if (PROTECTED_ROUTES.includes(route) && !currentUser) {
                navigate('#/login');
                return;
            }
            await renderRoute(route);
            window.scrollTo(0, 0);
        }
        window.addEventListener('hashchange', guardAndRender);

        async function renderRoute(route) {
            const view = document.getElementById('view');
            switch (route) {
                case '#/login': view.innerHTML = loginTemplate(); bindLogin(); break;
                case '#/register': view.innerHTML = registerTemplate(); bindRegister(); break;
                case '#/forgot': view.innerHTML = forgotTemplate(); bindForgot(); break;
                case '#/app': view.innerHTML = appTemplate(); await bindApp(); break;
                case '#/account': view.innerHTML = accountTemplate(); bindAccount(); break;
                default: view.innerHTML = landingTemplate(); bindLandingEvents(); break;
            }
        }

        /* ─── Nav ─── */
        function navTemplate() {
            const links = currentUser ?
                `<div class="nav-links">
                    <a class="nav-link" href="#/app">Roster</a>
                    <a class="nav-link" href="#/account">Account</a>
                    <div class="user-chip">
                        <div class="dot-avatar">${initials(currentUser.name)}</div>
                        ${currentUser.name.split(' ')[0]}
                    </div>
                    <button class="nav-btn ghost" id="logoutBtn">Log out</button>
                </div>` :
                `<div class="nav-links">
                    <a class="nav-link" href="#/login">Log in</a>
                    <button class="nav-btn" id="navRegister">Create account</button>
                </div>`;
            return `
            <nav class="nav">
                <a class="wordmark" href="#/">Roster<span class="dot">.</span></a>
                ${links}
            </nav>`;
        }

        function bindNav() {
            const logout = document.getElementById('logoutBtn');
            if (logout) logout.addEventListener('click', async () => {
                await apiFetch('/logout', { method: 'POST' });
                currentUser = null; candidates = []; atsMode = false;
                showToast('Logged out.');
                navigate('#/');
            });
            const reg = document.getElementById('navRegister');
            if (reg) reg.addEventListener('click', () => navigate('#/register'));
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            if (!t) return;
            t.textContent = msg;
            t.classList.add('show');
            clearTimeout(t._timer);
            t._timer = setTimeout(() => t.classList.remove('show'), 2800);
        }

        /* ═══════════════════════════════════════════════════════════════
           LANDING
           ═══════════════════════════════════════════════════════════════ */
        function landingTemplate() {
            return `
            ${navTemplate()}
            <section class="hero">
                <div class="hero-content">
                    <div class="badge">🚀 Find your next teammate</div>
                    <h1>Find the right person <em>faster</em> than another headline call.</h1>
                    <p>Search a roster of candidates by skill, discipline, and availability. Upload a résumé and Roster reads it for you — no re‑typing contact details by hand.</p>
                    <div class="hero-ctas">
                        <button class="nav-btn" id="heroRegister">Create a free account</button>
                        <button class="nav-btn ghost" id="heroLogin">Log in</button>
                    </div>
                    <div class="stat-row" id="landingStats">
                        <div class="stat"><span class="n" id="statCount">—</span><span class="l">Candidates on file</span></div>
                        <div class="stat"><span class="n">6</span><span class="l">Disciplines</span></div>
                        <div class="stat"><span class="n">1</span><span class="l">Résumé reader</span></div>
                    </div>
                </div>
                <div class="hero-card">
                    <div class="tab">ENG</div>
                    <div class="name">Naomi Reyes</div>
                    <div class="role">Engineering · 6 yrs · Austin, TX</div>
                    <div class="status-row"><span class="status-dot" style="background:#3A7A5A"></span>Available now</div>
                    <div class="skill-tags">
                        <span class="tag">TypeScript</span><span class="tag">React</span><span class="tag">Node.js</span>
                    </div>
                </div>
            </section>
            <footer class="site-footer">Roster — full‑stack demo with MySQL + Express.</footer>`;
        }

        async function bindLandingEvents() {
            bindNav();
            document.getElementById('heroRegister')?.addEventListener('click', () => navigate('#/register'));
            document.getElementById('heroLogin')?.addEventListener('click', () => navigate('#/login'));
            const res = await apiFetch('/candidates');
            if (res.ok && res.data.candidates) {
                document.getElementById('statCount').textContent = res.data.candidates.length;
            } else {
                document.getElementById('statCount').textContent = '0';
                if (!res.ok && res.status === 0) {
                    const stats = document.getElementById('landingStats');
                    if (stats) {
                        const note = document.createElement('div');
                        note.style.cssText = 'width:100%; margin-top:12px; font-size:13px; color:var(--rust); background:var(--rust-bg); padding:8px 16px; border-radius:var(--radius-sm);';
                        note.textContent = '⚠️ Backend not reachable — start the server on localhost:3001';
                        stats.appendChild(note);
                    }
                }
            }
        }

        /* ═══════════════════════════════════════════════════════════════
           LOGIN (with Face Login)
           ═══════════════════════════════════════════════════════════════ */
        function loginTemplate() {
            return `
            ${navTemplate()}
            <div class="auth-shell">
                <div class="auth-card">
                    <div class="tab">SIGN IN</div>
                    <h1>Welcome back</h1>
                    <div class="auth-sub">Log in to search the roster</div>
                    <div class="auth-hint">No account yet? Use <strong>demo@roster.app</strong> / <strong>roster123</strong> to look around, or create your own account.</div>
                    <div class="form-msg error" id="loginMsg"></div>
                    <form id="loginForm">
                        <div class="field" id="loginEmailField">
                            <label>Email</label>
                            <input type="text" id="loginEmail" autocomplete="username" />
                            <div class="field-error">Enter the email you registered with.</div>
                        </div>
                        <div class="field" id="loginPasswordField">
                            <label>Password</label>
                            <input type="password" id="loginPassword" autocomplete="current-password" />
                            <div class="field-error">Enter your password.</div>
                        </div>
                        <div class="auth-forgot"><button type="button" id="forgotLink">Forgot password?</button></div>
                        <button type="submit" class="auth-submit">Log in</button>
                    </form>
                    
                    <!-- Face Login Section -->
                    <div style="margin:24px 0 0; border-top:1px solid var(--line); padding-top:20px;">
                        <p style="font-size:13px; color:var(--ink-soft); text-align:center;">Or log in with your face</p>
                        <div style="display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin-top:8px;">
                            <input type="file" id="faceInput" accept="image/*" style="display:none;" />
                            <button class="nav-btn ghost" id="faceUploadBtn">📷 Upload photo</button>
                            <button class="nav-btn ghost" id="faceCameraBtn">📸 Use webcam</button>
                        </div>
                        <div id="facePreview" style="margin-top:12px; max-width:200px; display:none; margin-left:auto; margin-right:auto;">
                            <img id="facePreviewImg" style="width:100%; border-radius:8px; border:1px solid var(--line);" />
                            <button class="nav-btn" id="faceLoginBtn" style="margin-top:8px; width:100%;">Login with face</button>
                        </div>
                    </div>

                    <div class="auth-switch">Don't have an account? <button id="toRegister">Create one</button></div>
                </div>
            </div>`;
        }

        function bindLogin() {
            bindNav();
            document.getElementById('toRegister').addEventListener('click', () => navigate('#/register'));
            document.getElementById('forgotLink').addEventListener('click', () => navigate('#/forgot'));

            // --- Email/Password login ---
            document.getElementById('loginForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const emailField = document.getElementById('loginEmailField');
                const passField = document.getElementById('loginPasswordField');
                const email = document.getElementById('loginEmail').value.trim().toLowerCase();
                const password = document.getElementById('loginPassword').value;
                const msg = document.getElementById('loginMsg');
                emailField.classList.remove('has-error');
                passField.classList.remove('has-error');
                msg.classList.remove('error', 'success');
                msg.style.display = 'none';

                let hasError = false;
                if (!email) { emailField.classList.add('has-error'); hasError = true; }
                if (!password) { passField.classList.add('has-error'); hasError = true; }
                if (hasError) return;

                const submitBtn = e.target.querySelector('button[type="submit"]');
                submitBtn.disabled = true;
                submitBtn.textContent = 'Logging in…';

                const res = await apiFetch('/login', {
                    method: 'POST',
                    body: JSON.stringify({ email, password })
                });
                if (!res.ok) {
                    msg.textContent = res.data.error || 'Something went wrong logging in.';
                    msg.classList.add('error');
                    msg.style.display = 'block';
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Log in';
                    return;
                }
                currentUser = res.data.user;
                await loadCandidates();
                showToast(`Welcome back, ${currentUser.name.split(' ')[0]}.`);
                navigate('#/app');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Log in';
            });

            // --- Face Login ---
            const faceInput = document.getElementById('faceInput');
            const faceUploadBtn = document.getElementById('faceUploadBtn');
            const faceCameraBtn = document.getElementById('faceCameraBtn');
            const facePreview = document.getElementById('facePreview');
            const facePreviewImg = document.getElementById('facePreviewImg');
            const faceLoginBtn = document.getElementById('faceLoginBtn');
            let capturedImageBase64 = null;

            // Upload from file
            faceUploadBtn.addEventListener('click', () => faceInput.click());
            faceInput.addEventListener('change', (e) => {
                if (e.target.files.length) {
                    const reader = new FileReader();
                    reader.onload = (ev) => {
                        facePreviewImg.src = ev.target.result;
                        facePreview.style.display = 'block';
                        capturedImageBase64 = ev.target.result.split(',')[1];
                    };
                    reader.readAsDataURL(e.target.files[0]);
                }
            });

            // Webcam capture
            faceCameraBtn.addEventListener('click', async () => {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                    const video = document.createElement('video');
                    video.srcObject = stream;
                    await video.play();
                    const canvas = document.createElement('canvas');
                    canvas.width = video.videoWidth || 640;
                    canvas.height = video.videoHeight || 480;
                    canvas.getContext('2d').drawImage(video, 0, 0);
                    const dataUrl = canvas.toDataURL('image/jpeg');
                    facePreviewImg.src = dataUrl;
                    facePreview.style.display = 'block';
                    capturedImageBase64 = dataUrl.split(',')[1];
                    stream.getTracks().forEach(t => t.stop());
                } catch (err) {
                    showToast('Camera access denied or not available.');
                }
            });

            // Face login button
            faceLoginBtn.addEventListener('click', async () => {
                if (!capturedImageBase64) {
                    showToast('Please capture or upload a photo first.');
                    return;
                }
                const res = await apiFetch('/face-login', {
                    method: 'POST',
                    body: JSON.stringify({ image_base64: capturedImageBase64 })
                });
                if (!res.ok) {
                    showToast(res.data.error || 'Face login failed.');
                    return;
                }
                currentUser = res.data.user;
                await loadCandidates();
                showToast(`Welcome back, ${currentUser.name.split(' ')[0]}.`);
                navigate('#/app');
            });
        }

        /* ═══════════════════════════════════════════════════════════════
           REGISTER (unchanged)
           ═══════════════════════════════════════════════════════════════ */
        function registerTemplate() {
            return `
            ${navTemplate()}
            <div class="auth-shell">
                <div class="auth-card">
                    <div class="tab">NEW ACCOUNT</div>
                    <h1>Create an account</h1>
                    <div class="auth-sub">Takes about a minute</div>
                    <div class="form-msg error" id="regMsg"></div>
                    <form id="regForm">
                        <div class="field" id="regNameField">
                            <label>Full name</label>
                            <input type="text" id="regName" autocomplete="name" />
                            <div class="field-error">Enter your name.</div>
                        </div>
                        <div class="field" id="regEmailField">
                            <label>Email</label>
                            <input type="text" id="regEmail" autocomplete="username" />
                            <div class="field-error">Enter a valid email address.</div>
                        </div>
                        <div class="field" id="regPasswordField">
                            <label>Password</label>
                            <input type="password" id="regPassword" autocomplete="new-password" />
                            <div class="field-error">Use at least 8 characters.</div>
                        </div>
                        <div class="field" id="regConfirmField">
                            <label>Confirm password</label>
                            <input type="password" id="regConfirm" autocomplete="new-password" />
                            <div class="field-error">Passwords don't match.</div>
                        </div>
                        <button type="submit" class="auth-submit">Create account</button>
                    </form>
                    <div class="auth-switch">Already have an account? <button id="toLogin">Log in</button></div>
                </div>
            </div>`;
        }

        function bindRegister() {
            bindNav();
            document.getElementById('toLogin').addEventListener('click', () => navigate('#/login'));
            document.getElementById('regForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const nameField = document.getElementById('regNameField');
                const emailField = document.getElementById('regEmailField');
                const passField = document.getElementById('regPasswordField');
                const confirmField = document.getElementById('regConfirmField');
                [nameField, emailField, passField, confirmField].forEach(f => f.classList.remove('has-error'));
                const msg = document.getElementById('regMsg');
                msg.style.display = 'none';

                const name = document.getElementById('regName').value.trim();
                const email = document.getElementById('regEmail').value.trim().toLowerCase();
                const password = document.getElementById('regPassword').value;
                const confirm = document.getElementById('regConfirm').value;

                let hasError = false;
                if (!name) { nameField.classList.add('has-error'); hasError = true; }
                if (!isValidEmail(email)) { emailField.classList.add('has-error'); hasError = true; }
                if (password.length < 8) { passField.classList.add('has-error'); hasError = true; }
                if (confirm !== password || !confirm) { confirmField.classList.add('has-error'); hasError = true; }
                if (hasError) return;

                const submitBtn = e.target.querySelector('button[type="submit"]');
                submitBtn.disabled = true;
                submitBtn.textContent = 'Creating account…';

                const res = await apiFetch('/register', {
                    method: 'POST',
                    body: JSON.stringify({ name, email, password })
                });
                if (!res.ok) {
                    msg.textContent = res.data.error || 'Something went wrong creating your account.';
                    msg.classList.add('error');
                    msg.style.display = 'block';
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Create account';
                    return;
                }
                currentUser = res.data.user;
                await loadCandidates();
                showToast(`Account created — welcome, ${currentUser.name.split(' ')[0]}.`);
                navigate('#/app');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Create account';
            });
        }

        /* ═══════════════════════════════════════════════════════════════
           FORGOT (unchanged)
           ═══════════════════════════════════════════════════════════════ */
        function forgotTemplate() {
            return `
            ${navTemplate()}
            <div class="auth-shell">
                <div class="auth-card">
                    <div class="tab">RESET PASSWORD</div>
                    <h1>Forgot your password?</h1>
                    <div class="auth-sub">We'll email you a reset link</div>
                    <div class="form-msg success" id="forgotSuccess" style="display:none;"></div>
                    <form id="forgotForm">
                        <div class="field" id="forgotEmailField">
                            <label>Email</label>
                            <input type="text" id="forgotEmail" autocomplete="username" placeholder="you@company.com" />
                            <div class="field-error">Enter the email you registered with.</div>
                        </div>
                        <button type="submit" class="auth-submit">Send reset link</button>
                    </form>
                    <div class="auth-switch">Remembered it? <button id="backToLogin">Log in</button></div>
                </div>
            </div>`;
        }

        function bindForgot() {
            bindNav();
            document.getElementById('backToLogin').addEventListener('click', () => navigate('#/login'));
            document.getElementById('forgotForm').addEventListener('submit', (e) => {

        /* ─── All app functions (loadCandidates, bindApp, buildChips, filteredCandidates, renderGrid, openDrawer, closeDrawer, resetAndCloseUpload, handleFile, addCandidateFromForm, restoreSession) remain unchanged ─── */
        // (They are exactly as in the previous version, so we keep them for brevity.
        //  In your final file, you must include them fully. I will include them below.)

        async function loadCandidates() {
            const res = await apiFetch('/candidates');
            if (res.ok && res.data.candidates) {
                candidates = res.data.candidates;
            } else {
                candidates = [];
                if (!res.ok && res.status === 0) {
                    showToast('⚠️ Backend not reachable – candidates list unavailable.');
                }
            }
        }

        async function bindApp() {
            bindNav();
            await loadCandidates();
            buildChips();
            renderGrid();

            document.getElementById('searchInput').addEventListener('input', (e) => {
                appState.query = e.target.value;
                renderGrid();
            });

            const overlay = document.getElementById('overlay');
            overlay.addEventListener('click', closeDrawer);

            const uploadOverlay = document.getElementById('uploadOverlay');
            document.getElementById('openUpload').addEventListener('click', () => uploadOverlay.classList.add('show'));
            document.getElementById('closeUpload').addEventListener('click', resetAndCloseUpload);
            uploadOverlay.addEventListener('click', (e) => { if (e.target === uploadOverlay) resetAndCloseUpload(); });

            const dropzone = document.getElementById('dropzone');
            const fileInput = document.getElementById('fileInput');
            dropzone.addEventListener('click', () => fileInput.click());
            dropzone.addEventListener('dragover', (e) => { e.preventDefault(); dropzone.classList.add('drag'); });
            dropzone.addEventListener('dragleave', () => dropzone.classList.remove('drag'));
            dropzone.addEventListener('drop', (e) => {
                e.preventDefault();
                dropzone.classList.remove('drag');
                if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
            });
            fileInput.addEventListener('change', (e) => {
                if (e.target.files.length) handleFile(e.target.files[0]);
            });

            document.getElementById('addBtn').addEventListener('click', addCandidateFromForm);

            // ─── ATS listeners ───
            const atsBtn = document.getElementById('atsSearchBtn');
            const clearAtsBtn = document.getElementById('clearAtsBtn');
            const jobDescInput = document.getElementById('jobDescInput');

            atsBtn.addEventListener('click', async () => {
                const jobDesc = jobDescInput.value.trim();
                if (!jobDesc) {
                    showToast('Please enter a job description.');
                    return;
                }
                const filters = {
                    jobDescription: jobDesc,
                    role: appState.role === 'ALL' ? undefined : appState.role,
                    availability: appState.avail === 'ALL' ? undefined : appState.avail,
                };
                const res = await apiFetch('/candidates/ats-search', {
                    method: 'POST',
                    body: JSON.stringify(filters)
                });
                if (!res.ok) {
                    showToast(res.data.error || 'ATS search failed.');
                    return;
                }
                candidates = res.data.candidates.map(c => ({ ...c, atsScore: c.atsScore ?? 0 }));
                atsMode = true;
                renderGrid();
                showToast(`Scored ${candidates.length} candidates by match.`);
            });

            clearAtsBtn.addEventListener('click', async () => {
                atsMode = false;
                jobDescInput.value = '';
                await loadCandidates();
                renderGrid();
                showToast('Cleared ATS scores.');
            });
        }

        function buildChips() {
            const roleChips = document.getElementById('roleChips');
            const availChips = document.getElementById('availChips');
            if (!roleChips || !availChips) return;
            const roles = ['ALL', ...Object.keys(ROLE_LABEL)];
            roleChips.innerHTML = roles.map(r =>
                `<div class="chip ${appState.role === r ? 'active' : ''}" data-role="${r}">${r === 'ALL' ? 'All' : ROLE_LABEL[r]}</div>`
            ).join('');
            const avails = ['ALL', ...Object.keys(AVAIL)];
            availChips.innerHTML = avails.map(a =>
                `<div class="chip ${appState.avail === a ? 'active' : ''}" data-avail="${a}">${a === 'ALL' ? 'All' : AVAIL[a].label}</div>`
            ).join('');
            roleChips.querySelectorAll('.chip').forEach(el => {
                el.addEventListener('click', () => { appState.role = el.dataset.role; buildChips(); renderGrid(); });
            });
            availChips.querySelectorAll('.chip').forEach(el => {
                el.addEventListener('click', () => { appState.avail = el.dataset.avail; buildChips(); renderGrid(); });
            });
        }

        function filteredCandidates() {
            const q = appState.query.trim().toLowerCase();
            return candidates.filter(c => {
                if (appState.role !== 'ALL' && c.role !== appState.role) return false;
                if (appState.avail !== 'ALL' && c.availability !== appState.avail) return false;
                if (!q) return true;
                const hay = (c.name + ' ' + ROLE_LABEL[c.role] + ' ' + c.location + ' ' +
                    (c.skills || []).map(s => s.name || s.n).join(' ') + ' ' + (c.bio || '')).toLowerCase();
                return hay.includes(q);
            });
        }

        function renderGrid() {
            const list = filteredCandidates();
            const countEl = document.getElementById('searchCount');
            if (countEl) countEl.textContent = list.length + (list.length === 1 ? ' match' : ' matches');
            const grid = document.getElementById('grid');
            if (!grid) return;
            if (list.length === 0) {
                grid.innerHTML = `<div class="empty-state">Nothing on file for that search — try a broader skill or discipline.</div>`;
                return;
            }
            grid.innerHTML = list.map(c => {
                const color = ROLE_COLOR[c.role] || '#1D4A4D';
                const skills = c.skills || [];
                const shown = skills.slice(0, 3);
                const extra = skills.length - shown.length;
                const av = AVAIL[c.availability] || AVAIL.open;
                const scoreBadge = atsMode ?
                    `<div style="font-size:14px; font-weight:700; color:var(--primary); margin:6px 0;">Match: ${c.atsScore !== undefined ? Math.round(c.atsScore) : 0}%</div>` :
                    '';
                return `
                    <div class="card" style="--role-color:${color}" data-id="${c.id}">
                        <div class="tab">${c.role}</div>
                        <div class="card-top">
                            <div class="avatar">${initials(c.name)}</div>
                            <div>
                                <div class="name">${c.name}</div>
                                <div class="role-tag">${ROLE_LABEL[c.role] || c.role} · ${c.years_experience || c.years || 0} yrs</div>
                            </div>
                        </div>
                        <div class="status-row"><span class="status-dot" style="background:${av.color}"></span>${av.label}</div>
                        ${scoreBadge}
                        <div class="meta-row">${c.location || '—'}</div>
                        <div class="skill-tags">
                            ${shown.map(s => `<span class="tag">${s.name || s.n}</span>`).join('')}
                            ${extra > 0 ? `<span class="tag more">+${extra} more</span>` : ''}
                        </div>
                    </div>`;
            }).join('');
            grid.querySelectorAll('.card').forEach(el => {
                el.addEventListener('click', () => openDrawer(Number(el.dataset.id)));
            });
        }

        /* ─── Drawer ─── */

            if (!c) return;

            const drawer = document.getElementById('drawer');

                        <div>

                    <div class="status-row" style="margin-top:16px;"><span class="status-dot" style="background:${av.color}"></span>${av.label}</div>
                    <div class="section-label">About</div>

                            </div>`).join('')}
                    </div>
                    <div class="section-label">Résumé</div>
                    ${c.resume_url ? `
                        <div class="resume-box">
                            <div class="resume-thumb">PDF</div>
                            <div><a class="resume-link" href="${c.resume_url}" target="_blank" rel="noopener">Open résumé</a></div>
                        </div>` : `<div class="no-resume">No résumé on file yet.</div>`}
                    <div class="section-label">Contact</div>
                    <div class="contact-block" id="contactBlock">

        /* ─── Upload ─── */
        function resetAndCloseUpload() {
            document.getElementById('uploadOverlay').classList.remove('show');
            document.getElementById('extractStatus').classList.remove('show');
            document.getElementById('formGrid').classList.remove('show');
            document.getElementById('thumbPreview').innerHTML = '';
            document.getElementById('fileInput').value = '';
            ['fName', 'fEmail', 'fPhone', 'fYears', 'fSkills', 'fBio'].forEach(id => document.getElementById(id).value = '');
            document.getElementById('emailHint').textContent = '';
            document.getElementById('phoneHint').textContent = '';
            currentResumeFile = null;
        }

        async function handleFile(file) {
            if (file.type !== 'application/pdf') {
                showToast('Please choose a PDF file.');
                return;
            }
            const statusEl = document.getElementById('extractStatus');
            statusEl.classList.add('show');
            document.getElementById('formGrid').classList.remove('show');
            currentResumeFile = file; // BUGFIX: keep the real File so we can upload it on save

            if (!pdfReaderAvailable()) {
                statusEl.textContent = 'The PDF reader didn\'t load (offline or blocked) — add the details below by hand.';
                document.getElementById('thumbPreview').innerHTML = '';
                document.getElementById('formGrid').classList.add('show');
                return;
            }

            statusEl.textContent = 'Reading résumé…';
            try {
                const buf = await file.arrayBuffer();
                const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
                const page = await pdf.getPage(1);
                const viewport = page.getViewport({ scale: 0.35 });
                const canvas = document.createElement('canvas');
                canvas.width = viewport.width;
                canvas.height = viewport.height;
                const ctx = canvas.getContext('2d');
                await page.render({ canvasContext: ctx, viewport }).promise;
                document.getElementById('thumbPreview').innerHTML = '';
                document.getElementById('thumbPreview').appendChild(canvas);
                const note = document.createElement('div');
                note.style.fontFamily = 'var(--font-sans)';
                note.style.fontSize = '12px';
                note.style.color = 'var(--ink-muted)';
                note.textContent = file.name;
                document.getElementById('thumbPreview').appendChild(note);

                let text = '';
                const pagesToScan = Math.min(2, pdf.numPages);
                for (let i = 1; i <= pagesToScan; i++) {
                    const p = await pdf.getPage(i);
                    const content = await p.getTextContent();
                    text += content.items.map(it => it.str).join(' ') + '\n';
                }

                const emailMatch = text.match(/[\w.+-]+@[\w-]+\.[\w.-]+/);
                const phoneMatch = text.match(/(\+?\d[\d\s\-().]{7,}\d)/);
                const lines = text.split(/\n|(?=[A-Z][a-z]+ [A-Z][a-z]+)/).map(l => l.trim()).filter(Boolean);
                let nameGuess = '';
                for (const l of lines.slice(0, 6)) {
                    if (l.length > 2 && l.length < 40 && !l.includes('@') && !/\d{3,}/.test(l)) {
                        nameGuess = l;
                        break;
                    }
                }

                document.getElementById('fName').value = nameGuess;
                document.getElementById('fEmail').value = emailMatch ? emailMatch[0] : '';
                document.getElementById('fPhone').value = phoneMatch ? phoneMatch[0].trim() : '';
                document.getElementById('emailHint').textContent = emailMatch ? 'auto-detected' : 'not found — add manually';
                document.getElementById('phoneHint').textContent = phoneMatch ? 'auto-detected' : 'not found — add manually';

                statusEl.textContent = '✓ Read the résumé — check the details below before saving.';
                document.getElementById('formGrid').classList.add('show');
            } catch (err) {
                statusEl.textContent = 'Could not read that PDF automatically — fill in the details below by hand.';
                document.getElementById('formGrid').classList.add('show');
            }
        }

        async function addCandidateFromForm() {
            const name = document.getElementById('fName').value.trim();
            const email = document.getElementById('fEmail').value.trim();
            if (!name || !email) {
                showToast('A name and email are needed to add someone to the roster.');
                return;
            }
            const role = document.getElementById('fRole').value;
            const years = parseInt(document.getElementById('fYears').value) || 0;
            const skillsRaw = document.getElementById('fSkills').value;
            const skills = skillsRaw.split(',').map(s => s.trim()).filter(Boolean).map(n => ({ n, l: 4 }));
            const bio = document.getElementById('fBio').value.trim() || 'No bio provided yet.';
            const phone = document.getElementById('fPhone').value.trim() || '—';

            const payload = {
                name, role, years, location: '—', availability: 'open',
                skills: skills.length ? skills : [{ n: 'Not specified', l: 1 }],
                bio, email, phone, linkedin: '—'
            };

            const res = await apiFetch('/candidates', {
                method: 'POST',
                body: JSON.stringify(payload)
            });

            if (!res.ok) {
                showToast(res.data.error || 'Failed to add candidate.');
                return;
            }

            const candidateId = res.data.id;

            // BUGFIX: previously the PDF was never actually sent to the
            // server — only a temporary in-browser blob URL was stored,
            // which broke on refresh and was never persisted anywhere.
            // Now we upload the real file to the résumé endpoint.
            if (currentResumeFile && candidateId) {
                try {
                    const formData = new FormData();
                    formData.append('resume', currentResumeFile);
                    const uploadRes = await fetch(`${API_BASE}/candidates/${candidateId}/resume`, {
                        method: 'POST',
                        credentials: 'include',
                        body: formData
                    });
                    if (!uploadRes.ok) {
                        const errData = await uploadRes.json().catch(() => ({}));
                        showToast(errData.error || 'Candidate added, but the résumé file failed to upload.');
                    }
                } catch (err) {
                    showToast('Candidate added, but the résumé file failed to upload.');
                }
            }

            await loadCandidates();
            buildChips();
            renderGrid();
            resetAndCloseUpload();
            showToast(`Added ${name} to the roster.`);
        }

        /* ─── Session restore ─── */
        async function restoreSession() {
            try {
                const res = await apiFetch('/me');
                if (res.ok && res.data.user) {
                    currentUser = res.data.user;
                    await loadCandidates();
                }
            } catch (_) { /* ignore */ }
        }

        /* ─── Boot ─── */
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                await restoreSession();
                await guardAndRender();
            } catch (err) {
                console.error('Boot error:', err);
                const view = document.getElementById('view');
                if (view) {
                    view.innerHTML = landingTemplate();
                    bindLandingEvents();
                }
            }
        });
    </script>
</body>
</html>
